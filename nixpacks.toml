[phases.setup]
nixPkgs = ["python3"]

[phases.install]
cmds = ["pnpm install --frozen-lockfile"]

[phases.build]
cmds = ["pnpm --filter api run db:generate", "pnpm --filter api run build"]

[start]
cmd = "pnpm --filter api exec prisma db push --accept-data-loss && pnpm --filter api run start:prod"

[phases.release]
cmds = []
